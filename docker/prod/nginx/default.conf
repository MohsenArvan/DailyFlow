map $uri $asset_cache_control {
    default "";
    ~^/build/assets/ "public, max-age=31536000, immutable";
}

map $http_x_forwarded_proto $proxy_https {
    default "";
    https on;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    server_tokens off;

    add_header Cache-Control $asset_cache_control;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location /build/assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param HTTPS $proxy_https if_not_empty;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_pass app:9000;
    }

    location ~ /\. { deny all; }
    location ~ \.php(?:/|$) { return 404; }
}
