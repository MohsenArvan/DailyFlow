services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-dailyflow}
      - DB_USERNAME=${DB_USERNAME:-dailyflow}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zzz-dailyflow-dev.ini:ro
    networks:
      - dailyflow-network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${FORWARD_WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dailyflow-network
    depends_on:
      - app

  node:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "${FORWARD_VITE_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - dailyflow-network
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dailyflow}
      POSTGRES_USER: ${DB_USERNAME:-dailyflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - dailyflow_pgdata:/var/lib/postgresql/data
    networks:
      - dailyflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dailyflow} -d ${DB_DATABASE:-dailyflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - dailyflow_redisdata:/data
    networks:
      - dailyflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-dailyflow}
      - DB_USERNAME=${DB_USERNAME:-dailyflow}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/var/www/html
    networks:
      - dailyflow-network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=pgsql
      - DB_HOST=database
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-dailyflow}
      - DB_USERNAME=${DB_USERNAME:-dailyflow}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/var/www/html
    networks:
      - dailyflow-network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan schedule:work

networks:
  dailyflow-network:
    driver: bridge

volumes:
  dailyflow_pgdata:
    driver: local
  dailyflow_redisdata:
    driver: local
  node_modules:
    driver: local
